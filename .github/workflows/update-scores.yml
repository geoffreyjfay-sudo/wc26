name: Update Scores

on:
  # schedule disabled — tournament complete (19 July 2026)
  workflow_dispatch:           # manual trigger from GitHub Actions tab (kept for reference)

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch scores
        run: python scores.py --api-key ${{ secrets.FOOTBALL_DATA_API_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No score changes — nothing to commit"
          else
            git commit -m "Auto-update scores $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
