// ── RENDER ────────────────────────────────────────────────────
let activeFilter = 'All';

function buildFilters() {
  const bar = document.getElementById('filterBar');
  bar.innerHTML = PEOPLE.map(p =>
    `<button class="filter-btn${p==='All'?' active':''}" onclick="setFilter('${p}')">${p}</button>`
  ).join('');
}

function setFilter(name) {
  activeFilter = name;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === name);
  });
  render();
}

function copyMsg(idx, btn) {
  const text = PREVIEWS[idx].msg;
  navigator.clipboard.writeText(text).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  });
  btn.textContent = '✅ Copied!'; btn.classList.add('copied');
  setTimeout(() => { btn.innerHTML = '📋 Copy to WhatsApp'; btn.classList.remove('copied'); }, 2000);
}

function render() {
  const list = document.getElementById('previewList');
  let filtered = activeFilter === 'All'
    ? [...PREVIEWS]
    : PREVIEWS.filter(p => p.people.includes(activeFilter));
  filtered.sort((a,b) => parseInt(a.date.match(/\d+/)[0]) - parseInt(b.date.match(/\d+/)[0]));

  if (!filtered.length) {
    list.innerHTML = `<div style="text-align:center;padding:40px;color:var(--muted);font-style:italic">No previews yet for ${activeFilter}. Check back as the tournament progresses!</div>`;
    return;
  }

  let html = '';
  let lastDate = '';

  filtered.forEach((p, i) => {
    const globalIdx = PREVIEWS.indexOf(p);
    if (p.date !== lastDate) {
      html += `<div class="day-label">📅 ${p.date}</div>`;
      lastDate = p.date;
    }
    html += `
    <div class="preview-card">
      <div class="card-header">
        <div class="matchup">
          <span>${p.home}</span>
          <span class="vs">vs</span>
          <span>${p.away}</span>
        </div>
        <div class="match-info">
          ${p.group} · ${p.time}<br>
          <span style="color:var(--gold-lt);font-weight:600">${p.owners}</span>
        </div>
      </div>
      <div class="wa-box">
        <div class="wa-label">📱 Tap message to select all · Button to copy</div>
        <div class="wa-message">${escHtml(p.msg)}</div>
        <button class="copy-btn" onclick="copyMsg(${globalIdx},this)">📋 Copy to WhatsApp</button>
      </div>
    </div>`;
  });

  html += `<div style="text-align:center;padding:32px;color:var(--muted);font-style:italic;font-size:0.85rem">That's every group-stage fixture: 71 previews, one family. Knockout previews to follow once the bracket is set ⚽</div>`;
  list.innerHTML = html;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

buildFilters();
render();
</script>
